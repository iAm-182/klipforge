name = "klipforge-edge"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

[[routes]]
pattern = "klip.breakthematrix.id"
custom_domain = true

[[kv_namespaces]]
binding = "STATE"
id = "8d5fe7d43d0e472e847e0a523f77431a"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/edge-register", "/edge-health"]

[vars]
APP_NAME = "KlipForge"